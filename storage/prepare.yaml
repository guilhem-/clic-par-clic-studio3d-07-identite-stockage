# Storage preparation Job (modules 6 and 7): buckets, lifecycle, policies, accounts, tests.
# MODE: --prepare (default), --empty or --identity-test (replaced by deploy.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: prepare
  namespace: storage
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: prepare }       # allowed by the s3-ingress rule
    spec:
      restartPolicy: Never
      volumes:
        - name: config
          configMap:
            name: storage-config
            items:
              - { key: upload.json, path: policies/upload.json }
              - { key: links.json, path: policies/links.json }
              - { key: personal-space.json, path: policies/personal-space.json }
              - { key: lifecycle.json, path: lifecycle.json }
      containers:
        - name: prepare
          image: storage-prepare:7
          imagePullPolicy: IfNotPresent
          args: ["python", "prepare.py", "MODE"]
          env:
            - { name: S3_INTERNAL, value: "http://s3.storage.svc.cluster.local:9000" }
            - { name: ROOT_KEY, valueFrom: { secretKeyRef: { name: s3-root, key: key } } }
            - { name: ROOT_SECRET, valueFrom: { secretKeyRef: { name: s3-root, key: secret } } }
            - { name: UPLOAD_SECRET, valueFrom: { secretKeyRef: { name: accounts, key: upload-secret } } }
            - { name: LINKS_SECRET, valueFrom: { secretKeyRef: { name: accounts, key: links-secret } } }
            # --identity-test (module 7): test tokens of two users, valid ten minutes
            - { name: TOKEN_A, valueFrom: { secretKeyRef: { name: test-tokens, key: a, optional: true } } }
            - { name: TOKEN_B, valueFrom: { secretKeyRef: { name: test-tokens, key: b, optional: true } } }
            - { name: NAME_A, valueFrom: { secretKeyRef: { name: test-tokens, key: name-a, optional: true } } }
            - { name: NAME_B, valueFrom: { secretKeyRef: { name: test-tokens, key: name-b, optional: true } } }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
